<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - FitLife</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Registro de Usuario</h2>
        <form action="{{ url_for('registro') }}" method="POST">
            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Edad:</label>
            <input type="number" name="edad" required>

            <label>Peso (kg):</label>
            <input type="number" step="0.1" name="peso" required>

            <label>Altura (cm):</label>
            <input type="number" step="0.1" name="altura" required>

            <label>Género:</label>
            <select name="genero" required>
                <option value="">Seleccione...</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
            </select>

            <label>Objetivo:</label>
            <select name="objetivo" required>
                <option value="">Seleccione...</option>
                <option value="bajar_peso">Bajar de peso</option>
                <option value="volumen">Ganar masa muscular</option>
                <option value="definicion">Definición muscular</option>
                <option value="tonificar">Tonificar / Mantener</option>
                <option value="flexibilidad">Flexibilidad / Movilidad</option>
            </select>

            <button type="submit" class="btn">Registrarme y Generar Rutina</button>
        </form>
    </div>
</body>
</html>
